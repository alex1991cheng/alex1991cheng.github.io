<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALTECS | Pal for Wheels | Professional Auto Parts & Accessories</title>
        <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="icon" href="icons/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css?v=20260604">
    <style>
        .search-header {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 80px 0;
            text-align: center;
            border-bottom: 4px solid var(--primary-color);
        }
        .search-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .search-results-container {
            padding: 80px 0;
            min-height: 50vh;
        }
        .search-query-text {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1.2rem;
        }
        .no-results {
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-muted);
            padding: 40px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/valtecs_logo.svg" alt="Valtecs Logo">
                </a>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="support.html">Support</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
                <div class="nav-search">
                    <form action="search.html" method="GET">
                        <input type="text" name="q" placeholder="Search..." class="search-input">
                        <button type="submit" class="search-btn" aria-label="Search">
                            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        </button>
                    </form>
                </div>
            </nav>
            <div class="mobile-menu-btn">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <main>
        <section class="search-header">
            <div class="container">
                <h1>Search Results</h1>
                <p>Showing results for: <span id="searchQuery" class="search-query-text">...</span></p>
            </div>
        </section>

        <section class="search-results-container bg-light">
            <div class="container">
                <div class="categories-grid" id="searchResults">
                    <!-- Search results will be injected here by JS -->
                    <div class="no-results">Loading results...</div>
                </div>
            </div>
        </section>
    </main>

    <footer style="background-color: var(--secondary-color); color: var(--text-light); padding: 40px 0; text-align: center; margin-top: auto;">
        <div class="container">
            <div class="footer-content" style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
                <div class="logo">
                    <img src="images/valtecs_logo_white.svg" alt="Valtecs Logo" class="footer-logo" style="height: 40px; opacity: 0.8;">
                </div>
                <p>&copy; 2024 Valtecs. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q') || '';
        
        const queryElement = document.getElementById('searchQuery');
        const resultsContainer = document.getElementById('searchResults');
        
        if (query.trim() !== '') {
            queryElement.textContent = '"' + query + '"';
            
            // 真实产品数据
            const productsData = [
                { title: "Truck Winch Remote Control", category: "trucks", link: "product-truck-winch-remote-control.html", img: "images/products/17.webp" },
                { title: "Turbo Intercooler Outlet Hose", category: "trucks", link: "product-turbo-intercooler-outlet-hose.html", img: "images/products/28.webp" },
                { title: "Truck Step Boot Brush", category: "rv-trailers trucks tools-accessories new", link: "product-truck-step-boot-brush.html", img: "images/products/34.webp" },
                { title: "Lever Action Barrel Pump", category: "tools", link: "product-lever-action-barrel-pump.html", img: "images/products/29.webp" },
                { title: "OBD2 Anti-Theft Lock", category: "tools", link: "product-obd2-anti-theft-lock.html", img: "images/products/32.webp" },
                { title: "Rotary Transfer Pump", category: "tools", link: "product-rotary-transfer-pump.html", img: "images/products/31.webp" },
                { title: "Clutch Alignment Tool", category: "motorcycles", link: "product-clutch-alignment-tool.html", img: "images/products/27.webp" },
                { title: "Front Door Lock Actuator Pair", category: "cars-suvs", link: "product-front-door-lock-actuator-pair.html", img: "images/products/24.webp" },
                { title: "OBD Auto Start Stop Eliminator", category: "tools-accessories new", link: "product-obd-auto-start-stop-eliminator.html", img: "images/products/23.webp" },
                { title: "Auto Start Stop Eliminator", category: "tools-accessories", link: "product-auto-start-stop-eliminator.html", img: "images/products/22.webp" },
                { title: "Heater Hose Tee Kit (90° & Angled)", category: "trucks", link: "product-heater-hose-tee-kit.html", img: "images/products/19.webp" },
                { title: "Dual Valve Core Removal Tool with Sight Glass", category: "tools-accessories new", link: "product-dual-valve-core-removal-tool-with-sight-glass.html", img: "images/products/18.webp" },
                { title: "Backup Rear View Camera", category: "cars-suvs new", link: "product-backup-rear-view-camera.html", img: "images/products/16.webp" },
                { title: "Under-Screen Organizer", category: "cars-suvs tools-accessories new", link: "product-under-screen-organizer.html", img: "images/products/6.webp" },
                { title: "Oil Catch Can Kit", category: "trucks tools-accessories", link: "product-oil-catch-can-kit.html", img: "images/products/9.webp" },
                { title: "Front Right Windshield Wiper Arm", category: "cars-suvs new", link: "product-front-right-windshield-wiper-arm.html", img: "images/products/10.webp" },
                { title: "Front Windshield Wiper Arm Pair Kit", category: "trucks", link: "product-front-windshield-wiper-arm-pair-kit.html", img: "images/products/11.webp" },
                { title: "Front Wiper Arm Pair Kit", category: "trucks", link: "product-front-wiper-arm-pair-kit.html", img: "images/products/12.webp" },
                { title: "Front Wiper Arm Pair", category: "trucks", link: "product-front-wiper-arm-pair.html", img: "images/products/13.webp" },
                { title: "Ignition & Front Door Lock Cylinder Set", category: "trucks", link: "product-ignition-front-door-lock-cylinder-set.html", img: "images/products/14.webp" },
                { title: "Tubing Straightener", category: "tools-accessories new", link: "product-tubing-straightener.html", img: "images/products/15.webp" },
                { title: "Front Left Armrest Repair Kit", category: "trucks", link: "product-front-left-armrest-repair-kit.html", img: "images/products/3.webp" },
                { title: "Front Right Armrest Repair Kit", category: "trucks", link: "product-front-right-armrest-repair-kit.html", img: "images/products/4.webp" },
                { title: "Air Oil Separator Assembly", category: "trucks new", link: "product-air-oil-separator-assembly.html", img: "images/products/5.webp" },
                { title: "ATF Thermal Bypass Valve", category: "trucks new", link: "product-atf-thermal-bypass-valve.html", img: "images/products/7.webp" },
                { title: "Front Upper & Lower Ball Joint Set", category: "motorcycles", link: "product-front-upper-lower-ball-joint-set.html", img: "images/products/8.webp" },
                { title: "Neutral Shift Assist Kit, Red", category: "motorcycles new", link: "product-neutral-shift-assist-red.html", img: "images/products/1.webp" },
                { title: "Neutral Shift Assist Kit, Black", category: "motorcycles", link: "product-neutral-shift-assist-black.html", img: "images/products/2.webp" },
                { title: "Scrub Mat", category: "rv-trailers tools-accessories new", link: "product-scrub-mat.html", img: "images/products/33.webp" }
            ];

            const lowerQuery = query.toLowerCase();
            const filteredCards = productsData.filter(item => {
                return item.title.toLowerCase().includes(lowerQuery) || item.category.toLowerCase().includes(lowerQuery);
            });

            if (filteredCards.length > 0) {
                resultsContainer.innerHTML = '';
                resultsContainer.className = 'shop-grid'; // Use shop-grid layout
                filteredCards.forEach(item => {
                    const isNew = item.category.includes('new');
                    const badgeHtml = isNew ? `<div class="shop-card-badge new">New</div>` : '';
                    
                    resultsContainer.innerHTML += `
                        <div class="shop-card" data-category="${item.category}" style="display: flex;">
                            ${badgeHtml}
                            <div class="shop-card-img" style="background-image: url('${item.img}'); background-size: contain; background-color: #fff;"></div>
                            <div class="shop-card-info">
                                <h3 class="shop-card-title">${item.title}</h3>
                                <a href="${item.link}" class="btn shop-card-btn">VIEW DETAILS</a>
                            </div>
                        </div>
                    `;
                });
            } else {
                resultsContainer.innerHTML = `<div class="no-results" style="grid-column: 1 / -1;">No results found for "${query}". Please try a different keyword.</div>`;
            }
        } else {
            queryElement.textContent = 'All Categories';
            resultsContainer.innerHTML = `<div class="no-results" style="grid-column: 1 / -1;">Please enter a keyword to search.</div>`;
        }
    </script>
    <script src="js/main.js?v=20260604"></script>
</body>
</html>
