<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALTECS | Pal for Wheels | Professional Auto Parts & Accessories</title>
        <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
    <link rel="icon" href="icons/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/style.css?v=20260604">
    <style>
        .search-header {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 80px 0;
            text-align: center;
            border-bottom: 4px solid var(--primary-color);
        }
        .search-header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .search-results-container {
            padding: 80px 0;
            min-height: 50vh;
        }
        .search-query-text {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 1.2rem;
        }
        .no-results {
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-muted);
            padding: 40px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/valtecs_logo.svg" alt="Valtecs Logo">
                </a>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="products.html">Products</a></li>
                    <li><a href="support.html">Support</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
                <div class="nav-search">
                    <form action="search.html" method="GET">
                        <input type="text" name="q" placeholder="Search..." class="search-input">
                        <button type="submit" class="search-btn" aria-label="Search">
                            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        </button>
                    </form>
                </div>
            </nav>
            <div class="mobile-menu-btn">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <main>
        <section class="search-header">
            <div class="container">
                <h1>Search Results</h1>
                <p>Showing results for: <span id="searchQuery" class="search-query-text">...</span></p>
            </div>
        </section>

        <section class="search-results-container bg-light">
            <div class="container">
                <div class="categories-grid" id="searchResults">
                    <!-- Search results will be injected here by JS -->
                    <div class="no-results">Loading results...</div>
                </div>
            </div>
        </section>
    </main>

    <footer style="background-color: var(--secondary-color); color: var(--text-light); padding: 40px 0; text-align: center; margin-top: auto;">
        <div class="container">
            <div class="footer-content" style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
                <div class="logo">
                    <img src="images/valtecs_logo_white.svg" alt="Valtecs Logo" class="footer-logo" style="height: 40px; opacity: 0.8;">
                </div>
                <p>&copy; 2024 Valtecs. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q') || '';
        
        const queryElement = document.getElementById('searchQuery');
        const resultsContainer = document.getElementById('searchResults');
        
        if (query.trim() !== '') {
            queryElement.textContent = '"' + query + '"';
            
            // 动态从 products.html 读取产品数据
            fetch('products.html')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.text();
                })
                .then(html => {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const shopCards = doc.querySelectorAll('.shop-card');
                    
                    const lowerQuery = query.toLowerCase();
                    const filteredCards = Array.from(shopCards).filter(card => {
                        const title = card.querySelector('.shop-card-title').textContent.toLowerCase();
                        const category = (card.getAttribute('data-category') || '').toLowerCase();
                        return title.includes(lowerQuery) || category.includes(lowerQuery);
                    });

                    if (filteredCards.length > 0) {
                        resultsContainer.innerHTML = '';
                        resultsContainer.className = 'shop-grid'; // 确保使用网格布局
                        filteredCards.forEach(card => {
                            card.style.display = 'flex'; // 覆盖可能被隐藏的样式
                            resultsContainer.appendChild(card);
                        });
                    } else {
                        resultsContainer.innerHTML = `<div class="no-results" style="grid-column: 1 / -1;">No results found for "${query}". Please try a different keyword.</div>`;
                    }
                })
                .catch(err => {
                    console.error('Error fetching products:', err);
                    // 如果在本地以 file:/// 协议打开，会有跨域限制导致 fetch 失败，这里给出友好的提示
                    if (window.location.protocol === 'file:') {
                        resultsContainer.innerHTML = `
                            <div class="no-results" style="grid-column: 1 / -1;">
                                <h3 style="color: #d9534f; margin-bottom: 10px;">⚠️ Local Preview Limitation</h3>
                                <p>Search relies on reading the products page, which is blocked by browsers when opening local files directly (<code>file:///</code>).</p>
                                <p><strong>Don't worry! This will work perfectly once you upload it to GitHub Pages.</strong></p>
                                <p style="font-size: 0.9rem; margin-top: 10px;">(To test locally, you can use VS Code Live Server or a local HTTP server.)</p>
                            </div>
                        `;
                    } else {
                        resultsContainer.innerHTML = `<div class="no-results" style="grid-column: 1 / -1;">An error occurred while searching. Please try again later.</div>`;
                    }
                });
        } else {
            queryElement.textContent = 'All Categories';
            resultsContainer.innerHTML = `<div class="no-results" style="grid-column: 1 / -1;">Please enter a keyword to search.</div>`;
        }
    </script>
    <script src="js/main.js?v=20260604"></script>
</body>
</html>
